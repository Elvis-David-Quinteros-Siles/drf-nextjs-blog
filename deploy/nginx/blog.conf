# Nginx interno del blog. El nginx del host termina TLS y reenvía aquí con el Host original.
# Los upstream se resuelven en cada request para que nginx arranque aunque alguno no esté listo.
resolver 127.0.0.11 valid=10s;

# ── Frontend + archivos de MinIO
server {
    listen 80;
    server_name blog.edqs.online;

    # Subidas directas a MinIO con URL firmada (imágenes de posts y perfil)
    client_max_body_size 50m;

    # Bucket del blog en MinIO. La URL firmada incluye el Host y la ruta, por eso
    # se reenvían sin cambios (Host original, URI completa).
    location /drf-nextjs-blog/ {
        set $minio http://minio:9000;
        proxy_pass $minio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        set $frontend http://blog-frontend:3000;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── Backend (API y admin de Django)
server {
    listen 80;
    server_name api.blog.edqs.online;

    client_max_body_size 20m;

    location / {
        set $backend http://blog-backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120;
    }
}
