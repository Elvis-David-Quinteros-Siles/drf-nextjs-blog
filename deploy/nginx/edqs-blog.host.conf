# Bloques para el nginx del host (~/web/nginx/conf.d/edqs.conf).
# Termina TLS y reenvía al nginx interno del blog (contenedor blog-nginx, red "proxy").

# ── Blog DRF + Next.js (~/drf-nextjs-blog, contenedor blog-nginx)
server {
    listen 443 ssl;
    server_name blog.edqs.online api.blog.edqs.online;
    ssl_certificate     /etc/letsencrypt/live/edqs.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edqs.online/privkey.pem;

    client_max_body_size 50m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://blog-nginx:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_read_timeout 300;
    }
}
